name: Windows desktop

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'desktop.py'
      - 'assets/**'
      - 'soundscrape/**'
      - 'tests/test_desktop.py'
      - 'tests/test_multi_download.py'
      - 'requirements-desktop.txt'
      - 'build-windows.ps1'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:
    inputs:
      soundcloud_url:
        description: 'Public SoundCloud track URL for a full download test'
        type: string
        default: 'https://soundcloud.com/ethmusic/lostin-powers-she-so-heavy'
      mixcloud_url:
        description: 'Public Mixcloud mix URL for a full download test'
        type: string
        default: 'https://www.mixcloud.com/dholbach/cryptkeeper/'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Install desktop dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Offline tests
        run: |
          python -m unittest discover -s tests -p test_desktop.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_multi_download.py -v
      - name: Build standalone EXE
        id: package
        shell: pwsh
        run: ./build-windows.ps1 -Python python
      - name: Test packaged SoundCloud download
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          TEST_URL: ${{ inputs.soundcloud_url || 'https://soundcloud.com/ethmusic/lostin-powers-she-so-heavy' }}
        run: |
          $process = Start-Process -FilePath ./dist/SoundScrape.exe -ArgumentList @('--smoke-test', ('"' + $env:TEST_URL + '"'), '--output', 'test-downloads/soundcloud', '--report', 'test-downloads/soundcloud.json') -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'SoundCloud live download failed; see report artifact.' }
      - name: Check packaged GUI runtime
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./dist/SoundScrape.exe -ArgumentList '--check-runtime' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Packaged GUI runtime failed.' }
      - name: Test packaged Mixcloud download
        if: always() && steps.package.outcome == 'success' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          TEST_URL: ${{ inputs.mixcloud_url || 'https://www.mixcloud.com/dholbach/cryptkeeper/' }}
        run: |
          $process = Start-Process -FilePath ./dist/SoundScrape.exe -ArgumentList @('--smoke-test', ('"' + $env:TEST_URL + '"'), '--output', 'test-downloads/mixcloud', '--report', 'test-downloads/mixcloud.json') -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Mixcloud live download failed; see report artifact.' }
      - name: Upload live test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-reports
          path: test-downloads/*.json
          if-no-files-found: ignore
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SoundScrape-Windows-x64
          path: |
            dist/SoundScrape.exe
            dist/SoundScrape.exe.sha256
            LICENSE
            THIRD-PARTY-NOTICES.md
      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/SoundScrape.exe dist/SoundScrape.exe.sha256 LICENSE THIRD-PARTY-NOTICES.md --draft --generate-notes --title "SoundScrape $env:GITHUB_REF_NAME"
